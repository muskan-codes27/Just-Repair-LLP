/* AI Chatbot */
#chatbot-toggle{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--blue),#0b8fba);color:#fff;font-size:25px;box-shadow:0 12px 30px rgba(18,99,245,.35);z-index:120;transition:.2s}
#chatbot-toggle:hover{transform:translateY(-3px) scale(1.03)}
#chatbot{position:fixed;right:22px;bottom:92px;width:min(380px,calc(100vw - 30px));height:520px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 22px 70px rgba(10,30,60,.22);display:none;flex-direction:column;overflow:hidden;z-index:119}
#chatbot.open{display:flex;animation:chatUp .2s ease}
@keyframes chatUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.chat-head{background:linear-gradient(135deg,#0d2858,#1263f5);color:#fff;padding:15px 16px;display:flex;align-items:center;justify-content:space-between}
.chat-title{display:flex;align-items:center;gap:10px}.chat-avatar{width:38px;height:38px;border-radius:12px;background:#ffffff20;display:grid;place-items:center;font-size:20px}.chat-title strong{display:block;font-size:14px}.chat-title small{display:block;color:#d5e6ff;font-size:11px;margin-top:2px}
.chat-close{border:0;background:#ffffff18;color:#fff;border-radius:8px;width:32px;height:32px;font-size:20px}
.chat-messages{flex:1;padding:14px;overflow:auto;background:#f7faff}
.chat-msg{max-width:84%;padding:10px 12px;border-radius:13px;margin:7px 0;font-size:12.5px;line-height:1.5;white-space:pre-line}
.chat-msg.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:5px}
.chat-msg.user{background:var(--blue);color:#fff;margin-left:auto;border-top-right-radius:5px}
.chat-suggestions{display:flex;gap:7px;overflow:auto;padding:9px 12px;background:#fff;border-top:1px solid var(--line)}
.chat-suggestions button{white-space:nowrap;border:1px solid #cfdbea;background:#f7faff;color:var(--blue);border-radius:999px;padding:7px 10px;font-size:11px}
.chat-input{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}
.chat-input input{flex:1;border:1px solid #d6dfea;border-radius:10px;padding:10px 11px;outline:none;font-size:12px}
.chat-input input:focus{border-color:var(--blue)}
.typing{display:flex;gap:3px;align-items:center}.typing span{animation:blink 1s infinite;opacity:.35}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:1}}
.chat-send{width:42px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700}
@media(max-width:700px){#chatbot{right:15px;bottom:82px;height:min(560px,calc(100vh - 105px))}#chatbot-toggle{right:15px;bottom:15px}}
</style>
